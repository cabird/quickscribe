[project]
name = "validation-ui"
version = "0.1.0"
description = "Speaker Identification Validation UI"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    # Dependencies from parent diarization_experiment
    "torch>=2.4.0,<2.5.0",
    "torchaudio>=2.4.0,<2.5.0",
    "speechbrain>=1.0.0",
    "huggingface-hub>=0.20.0,<0.25.0",
    "azure-storage-blob>=12.19.0",
    "numpy>=1.24.0",
    "quickscribe-shared",
    "aiohttp>=3.13.3",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[tool.uv.sources]
quickscribe-shared = { path = "../../shared_quickscribe_py", editable = true }

