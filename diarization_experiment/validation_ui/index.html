<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker Identification Validation</title>

    <!-- PrimeReact CSS (Required - Load First) -->
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css" />
    <link rel="stylesheet" href="https://unpkg.com/primereact/resources/themes/lara-light-blue/theme.css" />
    <link rel="stylesheet" href="https://unpkg.com/primereact/resources/primereact.min.css" />

    <!-- Custom Styles -->
    <style>
        /* ===== CSS Custom Properties ===== */
        :root {
            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-success: #16a34a;
            --color-danger: #dc2626;
            --color-warning: #d97706;
            --color-text-primary: #1e293b;
            --color-text-secondary: #64748b;
            --color-text-muted: #94a3b8;
            --color-bg-page: #f1f5f9;
            --color-bg-card: #ffffff;
            --color-bg-subtle: #f8fafc;
            --color-border: #e2e8f0;
            --color-border-light: #f1f5f9;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --font-size-xs: 0.75rem;
            --font-size-sm: 0.8125rem;
            --font-size-base: 0.875rem;
            --font-size-lg: 1rem;
            --font-size-xl: 1.25rem;
            --font-size-2xl: 1.5rem;
            --font-size-3xl: 2rem;
            --line-height-tight: 1.25;
            --line-height-normal: 1.5;
            --line-height-relaxed: 1.625;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: var(--font-size-base);
            line-height: var(--line-height-normal);
            color: var(--color-text-primary);
            background: var(--color-bg-page);
            height: 100vh;
            overflow: hidden;
        }

        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ===== Keyboard Hints ===== */
        .keyboard-hint {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            height: 26px;
            padding: 0 8px;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-xs);
            font-weight: 600;
            font-family: 'SF Mono', SFMono-Regular, ui-monospace, monospace;
            color: var(--color-text-secondary);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
        }

        .keyboard-hints-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-lg);
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--color-border-light);
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
        }

        .keyboard-hints-row > span {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        /* ===== Progress Header ===== */
        .progress-header {
            background: var(--color-bg-card);
            border-bottom: 1px solid var(--color-border);
            padding: var(--spacing-md) var(--spacing-xl);
            box-shadow: var(--shadow-sm);
        }

        /* ===== Main Validation Container ===== */
        .validation-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
            overflow: auto;
        }

        /* ===== Navigation Bar ===== */
        .validation-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-sm) 0;
        }

        .nav-buttons {
            display: flex;
            gap: var(--spacing-xs);
        }

        .nav-buttons .p-button {
            width: 36px;
            height: 36px;
        }

        .labeled-indicator {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-xs) var(--spacing-md);
            background: #dcfce7;
            border: 1px solid #86efac;
            border-radius: var(--radius-md);
            color: #166534;
            font-size: var(--font-size-sm);
            font-weight: 500;
        }

        /* ===== Validation Card ===== */
        .validation-card {
            width: 100%;
            max-width: 640px;
            animation: slideIn 0.25s ease-out;
        }

        .validation-card .p-card {
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--color-border-light);
        }

        .validation-card .p-card-body {
            padding: var(--spacing-xl);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Main Question Section ===== */
        .main-question {
            text-align: center;
            padding: var(--spacing-lg) 0;
        }

        .main-question h1 {
            font-size: var(--font-size-xl);
            font-weight: 500;
            color: var(--color-text-secondary);
            line-height: var(--line-height-tight);
            margin-bottom: var(--spacing-xs);
        }

        .participant-name-large {
            display: block;
            font-size: var(--font-size-3xl);
            font-weight: 700;
            color: var(--color-primary);
            line-height: var(--line-height-tight);
            margin-top: var(--spacing-sm);
        }

        /* ===== Context Info ===== */
        .context-info {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: var(--spacing-sm) var(--spacing-md);
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
            padding: var(--spacing-sm) 0;
        }

        .context-info > span {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .context-info .separator {
            color: var(--color-border);
        }

        /* ===== Confidence Section ===== */
        .confidence-section {
            background: var(--color-bg-subtle);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin: var(--spacing-md) 0;
        }

        .confidence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        .confidence-label {
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--color-text-secondary);
        }

        .confidence-bar {
            height: 6px;
            background: var(--color-border);
            border-radius: 3px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .confidence-fill.high {
            background: var(--color-success);
        }

        .confidence-fill.medium {
            background: var(--color-warning);
        }

        .confidence-fill.low {
            background: var(--color-danger);
        }

        /* ===== Audio Player ===== */
        .audio-player {
            background: var(--color-bg-subtle);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
        }

        .audio-player-controls {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .audio-progress-bar {
            flex: 1;
        }

        .audio-time-display {
            display: flex;
            justify-content: space-between;
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
            margin-bottom: var(--spacing-xs);
            font-variant-numeric: tabular-nums;
        }

        .audio-progress-track {
            height: 6px;
            background: var(--color-border);
            border-radius: 3px;
            overflow: hidden;
        }

        .audio-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .audio-player-hint {
            margin-top: var(--spacing-md);
            text-align: center;
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
        }

        /* ===== Reference Audio Section ===== */
        .reference-audio-section {
            background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 100%);
            border: 1px solid #bfdbfe;
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .reference-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-sm);
        }

        .reference-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-weight: 600;
            font-size: var(--font-size-sm);
            color: var(--color-primary);
        }

        .reference-sample-indicator {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            background: var(--color-bg-card);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .reference-recording-title {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .reference-player-wrapper {
            background: var(--color-bg-card);
            border-radius: var(--radius-sm);
            padding: var(--spacing-sm);
        }

        .reference-player-wrapper .audio-player {
            background: transparent;
            border: none;
            padding: var(--spacing-sm) var(--spacing-md);
        }

        .reference-cycle-hint {
            margin-top: var(--spacing-sm);
            text-align: center;
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
        }

        /* ===== Action Buttons ===== */
        .action-buttons {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
            margin-top: var(--spacing-xl);
        }

        .action-buttons .p-button {
            min-width: 120px;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
        }

        .action-buttons .p-button-lg {
            font-size: var(--font-size-base);
        }

        /* ===== Enhanced Action Buttons (Two Rows) ===== */
        .action-buttons-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            margin-top: var(--spacing-xl);
        }

        .action-buttons-row {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
        }

        .action-buttons-row .p-button {
            min-width: 160px;
            font-weight: 600;
            padding: 0.75rem 1.25rem;
        }

        .action-buttons-row.primary-row .p-button {
            flex: 1;
            max-width: 200px;
        }

        .action-buttons-row.secondary-row .p-button {
            flex: 1;
            max-width: 180px;
        }

        /* Button specific styles */
        .btn-yes-training {
            background: var(--color-success) !important;
            border-color: var(--color-success) !important;
        }

        .btn-yes-training:hover {
            background: #15803d !important;
            border-color: #15803d !important;
        }

        .btn-yes-not-training {
            color: var(--color-success) !important;
            border-color: var(--color-success) !important;
        }

        .btn-yes-not-training:hover {
            background: rgba(22, 163, 74, 0.1) !important;
        }

        /* ===== Feedback Flash Animations ===== */
        .success-flash {
            animation: flash-green 0.4s ease-out;
        }

        .success-flash-dim {
            animation: flash-green-dim 0.4s ease-out;
        }

        .error-flash {
            animation: flash-red 0.4s ease-out;
        }

        .warning-flash {
            animation: flash-yellow 0.4s ease-out;
        }

        @keyframes flash-green {
            0%, 100% { background: var(--color-bg-card); }
            50% { background: #dcfce7; }
        }

        @keyframes flash-green-dim {
            0%, 100% { background: var(--color-bg-card); }
            50% { background: #f0fdf4; }
        }

        @keyframes flash-red {
            0%, 100% { background: var(--color-bg-card); }
            50% { background: #fee2e2; }
        }

        @keyframes flash-yellow {
            0%, 100% { background: var(--color-bg-card); }
            50% { background: #fef3c7; }
        }

        /* ===== Reassign Dialog ===== */
        /* Target PrimeReact Dialog internal content area */
        .p-dialog .p-dialog-content {
            padding: var(--spacing-lg) var(--spacing-xl);
        }

        .p-dialog .p-dialog-header {
            padding: var(--spacing-lg) var(--spacing-xl) var(--spacing-md);
        }

        .p-dialog .p-dialog-footer {
            padding: var(--spacing-md) var(--spacing-xl) var(--spacing-lg);
        }

        .reassign-dialog-content {
            padding: 0;
        }

        .reassign-dialog-content > p {
            margin-bottom: var(--spacing-xl);
            line-height: var(--line-height-normal);
            font-size: var(--font-size-base);
        }

        .reassign-dialog-content .form-group {
            margin-bottom: var(--spacing-md);
        }

        .reassign-dialog-content .form-group label {
            display: block;
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-sm);
            letter-spacing: 0.01em;
        }

        /* Style the dropdown and inputs consistently */
        .reassign-dialog-content .form-group .p-dropdown,
        .reassign-dialog-content .form-group input[type="text"] {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            min-height: 44px;
        }

        .reassign-dialog-content .form-divider {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
            margin: var(--spacing-xl) 0;
            color: var(--color-text-muted);
            font-size: var(--font-size-xs);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        .reassign-dialog-content .form-divider::before,
        .reassign-dialog-content .form-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-border);
        }

        /* Full-width buttons in dialog */
        .reassign-dialog-content > .p-button {
            padding: var(--spacing-sm) var(--spacing-lg);
            min-height: 44px;
        }

        .reassign-dialog-footer {
            display: flex;
            gap: var(--spacing-lg);
            justify-content: space-between;
            align-items: center;
        }

        .reassign-dialog-footer .p-button {
            min-width: 110px;
        }

        .reassign-error-message {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-lg);
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: var(--radius-md);
            color: var(--color-danger);
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-xl);
            line-height: var(--line-height-normal);
        }

        .reassign-error-message > svg {
            flex-shrink: 0;
            margin-top: 2px;
        }

        .training-quality-option {
            margin-top: var(--spacing-xl);
            padding: var(--spacing-lg) var(--spacing-xl);
            border-top: 1px solid var(--color-border-light);
            background: rgba(0, 0, 0, 0.02);
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            margin-left: calc(-1 * var(--spacing-xl));
            margin-right: calc(-1 * var(--spacing-xl));
            margin-bottom: calc(-1 * var(--spacing-lg));
        }

        .training-quality-option .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-md);
            cursor: pointer;
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
            line-height: var(--line-height-normal);
            font-weight: 500;
        }

        .training-quality-option .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            min-width: 18px;
            margin-top: 1px;
            cursor: pointer;
            accent-color: var(--color-primary);
            border-radius: var(--radius-sm);
        }

        .training-quality-option small {
            display: block;
            margin-top: var(--spacing-xs);
            margin-left: 0;
            padding-left: calc(18px + var(--spacing-md));
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
            line-height: 1.6;
        }

        /* Back button in create mode */
        .reassign-dialog-content > .p-button-text {
            margin-top: var(--spacing-md);
            color: var(--color-text-secondary);
        }

        /* ===== Loading & Complete States ===== */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: var(--spacing-xl);
        }

        .session-complete {
            text-align: center;
            padding: var(--spacing-xl);
        }

        /* ===== Identification Card ===== */
        .identification-card {
            width: 100%;
            max-width: 640px;
            animation: slideIn 0.25s ease-out;
        }

        .identification-card .p-card {
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--color-border-light);
        }

        .identification-card .p-card-body {
            padding: var(--spacing-xl);
        }

        .cluster-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 1px solid #fbbf24;
            color: #92400e;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        .sample-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-md);
            margin: var(--spacing-md) 0 var(--spacing-lg);
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-bg-subtle);
            border-radius: var(--radius-md);
        }

        .sample-navigation .sample-indicator {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            font-weight: 500;
            min-width: 100px;
            text-align: center;
        }

        .main-question .subtitle {
            font-size: var(--font-size-base);
            color: var(--color-text-muted);
            margin-top: var(--spacing-sm);
        }

        .identification-form {
            background: var(--color-bg-subtle);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin: var(--spacing-lg) 0;
        }

        .identification-form .form-group {
            margin-bottom: var(--spacing-md);
        }

        .identification-form .form-group label {
            display: block;
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .identification-form .form-divider {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin: var(--spacing-lg) 0;
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
        }

        .identification-form .form-divider::before,
        .identification-form .form-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-border);
        }

        /* ===== Phase Indicator ===== */
        .phase-indicator {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-bg-subtle);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-md);
        }

        .phase-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-xs);
            font-weight: 600;
        }

        .phase-badge.phase-known {
            background: #dbeafe;
            color: #1e40af;
        }

        .phase-badge.phase-unknown {
            background: #fef3c7;
            color: #92400e;
        }

        /* ===== Utility Classes ===== */
        .text-center { text-align: center; }
        .text-muted { color: var(--color-text-muted); }
        .text-secondary { color: var(--color-text-secondary); }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
    </style>

    <!-- React 18 (Load BEFORE PrimeReact and Lucide) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- PrimeReact Standalone Bundle -->
    <script src="/primereact-standalone-bundle.umd.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- Initialize namespace -->
    <script>window.ValidationApp = {};</script>

    <!-- Load components in dependency order -->
    <script type="text/babel" src="components/Icon.jsx"></script>
    <script type="text/babel" src="components/AudioPlayer.jsx"></script>
    <script type="text/babel" src="components/ReferenceAudioPlayer.jsx"></script>
    <script type="text/babel" src="components/ProgressHeader.jsx"></script>
    <script type="text/babel" src="components/ValidationCard.jsx"></script>
    <script type="text/babel" src="components/IdentificationCard.jsx"></script>
    <script type="text/babel" src="components/App.jsx"></script>

    <!-- Render the app -->
    <script type="text/babel">
        ReactDOM.createRoot(document.getElementById('root')).render(<ValidationApp.App />);
    </script>
</body>
</html>
